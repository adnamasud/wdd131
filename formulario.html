<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Produto | WDD 131</title>
    <meta name="description" content="Forneça uma avaliação sincera a respeito de como foi sua experiência com nossos produtos.">
    <meta name="author" content="Amanda de Souza Silva">
    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>
<body>
    <header>
        <h1>Avaliação de Produto</h1>
    </header>
    <main>
        <form method="get" action="avaliacao.html" class="f1">
            <label for="produto">Nome do produto</label>
            <select name="produto" id="produto" required>
                <option value="" disabled selected>Selecione um Produto...</option>
            </select>
            <fieldset class="classificacao">
                <legend>Classificação Geral</legend>
                <div>
                    <input type="radio" id="estrela1" name="avaliacao" value="1" required>
                    <label for="estrela1">⭐</label>
                </div>
                <div>
                    <input type="radio" id="estrela2" name="avaliacao" value="2" required>
                    <label for="estrela2">⭐⭐</label>
                </div>
                <div>
                    <input type="radio" id="estrela3" name="avaliacao" value="3" required>
                    <label for="estrela3">⭐⭐⭐</label>
                </div>
                <div>
                    <input type="radio" id="estrela4" name="avaliacao" value="4" required>
                    <label for="estrela4">⭐⭐⭐⭐</label>
                </div>
                <div>
                    <input type="radio" id="estrela5" name="avaliacao" value="5" required>
                    <label for="estrela5">⭐⭐⭐⭐⭐</label>
                </div>
            </fieldset>
            <label for="data-instalacao">Data da Instalação</label>
            <input type="date" id="data-instalacao" name="data-instalacao" required>
            <fieldset class="recursos">
                <legend>Recursos Úteis</legend>
                <div>
                    <input type="checkbox" id="facilidade" name="recursos" value="facilidade">
                    <label for="facilidade">Facilidade de uso</label>
                </div>
                <div>
                    <input type="checkbox" id="durabilidade" name="recursos" value="durabilidade">
                    <label for="durabilidade">Durabilidade</label>
                </div>
                <div>
                    <input type="checkbox" id="desempenho" name="recursos" value="desempenho">
                    <label for="desempenho">Desempenho</label>
                </div>
                <div>
                    <input type="checkbox" id="design" name="recursos" value="design">
                    <label for="design">Design</label>
                </div>
                <div>
                    <input type="checkbox" id="custo-beneficio" name="recursos" value="custo-beneficio">
                    <label for="custo-beneficio">Custo-benefício</label>
                </div>
            </fieldset>

            <label for="avaliacao-escrita">Avaliação Escrita</label>
            <textarea name="avaliacao-escrita" id="avaliacao-escrita"></textarea>

            <label for="nome-usuario">Nome de Usuário</label>
            <input type="text" id="nome-usuario" name="nome-usuario">

            <input type="submit" value="Enviar Avaliação">

        </form>
    </main>
    <footer>
        <p>© <span id="anoatual"></span> ❣ Amanda de Souza Silva ❣ Pará, Brasil</p>
        <p id="ultimaModificacao"></p>
    </footer>
</body>
</html>
