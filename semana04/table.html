<!DOCTYPE html>
<html lang="pr-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas HTML</title>
    <link rel="stylesheet" href="estilos/table.css">
</head>
<body>
    <main>
        <table>
            <caption>Tabela 1: Comparação de Recursos da Conta</caption>
            <thead>
                <tr>
                    <th class="empresa" colspan="4">ACME Wildwest Services</th>
                </tr>
                <tr class="titulos">
                    <th>Recursos</th>
                    <th>Básico</th>
                    <th>Premium</th>
                    <th>Luxo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th class="rec">Recursos 1</th>
                    <td>✔</td>
                    <td>✔</td>
                    <td>✔</td>
                </tr>
                <tr>
                    <th class="rec">Recurso 2</th>
                    <td>❌</td>
                    <td>✔</td>
                    <td>✔</td>
                </tr>
                <tr>
                    <th class="rec">Recurso 3</th>
                    <td>❌</td>
                    <td>❌</td>
                    <td>✔</td>
                </tr>
                
            </tbody>
        </table>
    </main>
</body>
</html>
